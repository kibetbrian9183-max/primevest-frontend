<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ============================================================
         PRIMARY SEO TAGS
         Domain placeholder: primevestbinary.com — swap every instance
         below in one pass if you end up buying a different domain.
         ============================================================ -->
    <title>PrimeVest — Trade Smarter. Profit Faster. | Online Trading Platform</title>
    <meta
      name="description"
      content="Trade forex, crypto, stocks, indices and commodities on PrimeVest. Deposit via M-Pesa or USDT, start from $1, and get payouts up to 950%. Sign up free in 30 seconds."
    />
    <meta
      name="keywords"
      content="PrimeVest, online trading Kenya, binary options Kenya, forex trading app, M-Pesa trading platform, crypto trading Kenya, volatility index trading, trade with M-Pesa"
    />
    <meta name="author" content="PrimeVest" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://primevestbinary.com/" />

    <!-- Theme color for mobile browser chrome (matches app's dark background) -->
    <meta name="theme-color" content="#0B0E14" />

    <!-- ============================================================
         OPEN GRAPH (Facebook, WhatsApp, LinkedIn link previews)
         ============================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PrimeVest" />
    <meta property="og:title" content="PrimeVest — Trade Smarter. Profit Faster." />
    <meta
      property="og:description"
      content="Access 100+ global markets with lightning-fast execution and payouts up to 950%. Deposit via M-Pesa or USDT. Start with just $10."
    />
    <meta property="og:url" content="https://primevestbinary.com/" />
    <meta property="og:image" content="https://primevestbinary.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- ============================================================
         TWITTER / X CARD
         ============================================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PrimeVest — Trade Smarter. Profit Faster." />
    <meta
      name="twitter:description"
      content="Access 100+ global markets with lightning-fast execution and payouts up to 950%. Deposit via M-Pesa or USDT. Start with just $10."
    />
    <meta name="twitter:image" content="https://primevestbinary.com/og-image.png" />

    <!-- ============================================================
         FAVICON / APP ICONS
         Drop these files into /public — see seo-assets-checklist.md
         ============================================================ -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Speeds up the first API call to your Render backend -->
    <link rel="preconnect" href="https://primevestbackend.onrender.com" crossorigin />

    <!-- ============================================================
         STRUCTURED DATA (JSON-LD) — helps Google show a rich result
         (sitelinks search box, organization panel) instead of a bare
         blue link. Two schemas: Organization (who you are) and
         WebSite (enables the sitelinks search box eligibility).
         ============================================================ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PrimeVest",
        "url": "https://primevestbinary.com/",
        "logo": "https://primevestbinary.com/logo.png",
        "sameAs": []
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PrimeVest",
        "url": "https://primevestbinary.com/"
      }
    </script>

    <!-- Your Vite build injects the bundled CSS/JS here automatically -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      PrimeVest requires JavaScript to run. Please enable it in your browser to continue.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
